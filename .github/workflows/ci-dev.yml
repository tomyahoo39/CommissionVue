name: Frontend CI (Dev Check)

on:
  pull_request:
    branches:
      - development   # 當有 PR 準備併入 dev 時觸發

jobs:
  test-and-check:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npm run test:unit --if-present

      - name: Build Check
        run: npm run build
